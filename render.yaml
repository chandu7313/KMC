version: "1"

# ============================================================
# Kissan Mithar Consultancy — Render Blueprint
# ============================================================
# This file defines the infrastructure as code for Render.com.
# It provisions 15 Private Services, 1 Web Service (Nginx Gateway),
# RabbitMQ (Private Service), and a Managed Redis instance.

envGroups:
  - name: kmc-shared-env
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # ── Service-Specific Secrets (Sync false so you can fill them in Render Dashboard) ──
      - key: FAST2SMS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PLANT_ID_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false

services:
  # ──────────────────────────────────────
  # INFRASTRUCTURE
  # ──────────────────────────────────────
  - type: redis
    name: redis
    plan: free # Note: Free Redis lacks persistence. Upgrade to starter for production.
    ipAllowList: [] # Accessible only within the Render private network

  - type: pserv
    name: rabbitmq
    env: docker
    dockerContext: microservices
    dockerfilePath: microservices/rabbitmq/Dockerfile
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        sync: false
      - key: RABBITMQ_DEFAULT_PASS
        sync: false
      - key: RABBITMQ_DEFAULT_VHOST
        value: kissan

  - type: web
    name: kissan-gateway
    env: docker
    dockerContext: microservices
    dockerfilePath: microservices/nginx/Dockerfile
    envVars:
      - key: PORT
        value: 80

  # ──────────────────────────────────────
  # MICROSERVICES (ALL PRIVATE)
  # ──────────────────────────────────────
  - type: pserv
    name: auth-service
    env: docker
    dockerContext: microservices
    dockerfilePath: microservices/services/auth-service/Dockerfile
    envGroups: [kmc-shared-env]
    envVars:
      - key: PORT
        value: 3001
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false

  - type: pserv
    name: user-service
    env: docker
    dockerContext: microservices
    dockerfilePath: microservices/services/user-service/Dockerfile

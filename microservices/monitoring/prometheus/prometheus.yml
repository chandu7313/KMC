# ============================================================
# Prometheus Configuration — Kissan Mithar Consultancy
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: kissan-mithar
    environment: production

# ─── Alerting ────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

# ─── Alert Rules ─────────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/service.rules.yml
  - /etc/prometheus/rules/business.rules.yml
  - /etc/prometheus/rules/infrastructure.rules.yml
  - /etc/prometheus/rules/nodejs.rules.yml
  - /etc/prometheus/rules/database.rules.yml

# ─── Scrape Targets ──────────────────────────────────────────
scrape_configs:

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus

  # All 15 Kissan Mithar microservices
  - job_name: kissan-services
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:3001
          - user-service:3002
          - ai-service:3003
          - disease-service:3004
          - soil-service:3005
          - market-service:3006
          - ecommerce-service:3007
          - order-service:3008
          - payment-service:3009
          - notification-service:3010
          - support-service:3011
          - expert-service:3012
          - content-service:3013
          - analytics-service:3014
          - field-service:3015
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
        replacement: '$1'

  # Nginx gateway (via nginx-exporter)
  - job_name: nginx
    scrape_interval: 15s
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: nginx-gateway

  # Node Exporter (host system metrics)
  - job_name: node-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: host-system

  # cAdvisor (container metrics)
  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: docker-containers

  # Redis
  - job_name: redis
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis

  # RabbitMQ (built-in Prometheus plugin)
  - job_name: rabbitmq
    scrape_interval: 15s
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          service: rabbitmq

  # Pushgateway (for batch jobs / cron metrics)
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # PostgreSQL
  - job_name: postgresql
    scrape_interval: 15s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgresql

  # MongoDB
  - job_name: mongodb
    scrape_interval: 15s
    static_configs:
      - targets: ['mongodb-exporter:9216']
        labels:
          service: mongodb

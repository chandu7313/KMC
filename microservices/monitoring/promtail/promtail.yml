# ============================================================
# Promtail Configuration — Kissan Mithar Consultancy
# ============================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki:3200/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:

  # ─── Docker Container Logs ────────────────────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Extract compose service name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      # Extract compose project name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: project
    pipeline_stages:
      # Try to parse JSON logs from Winston
      - json:
          expressions:
            level: level
            message: message
            service: service
            timestamp: timestamp
      # Set labels from parsed JSON
      - labels:
          level:
          service:
      # Normalize level to lowercase
      - template:
          source: level
          template: '{{ ToLower .Value }}'
      - labels:
          level:
      # Drop debug logs to save storage
      - match:
          selector: '{level="debug"}'
          action: drop
          drop_counter_reason: debug_log_dropped

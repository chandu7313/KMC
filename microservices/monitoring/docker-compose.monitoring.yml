# ============================================================
# Monitoring Stack — Kissan Mithar Consultancy
# ============================================================
# Usage: docker-compose -f monitoring/docker-compose.monitoring.yml up -d
# ============================================================

networks:
  kissan-network:
    external: true
    name: kissan-network
  monitoring-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

services:

  # ─── Prometheus ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: kissan-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - kissan-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Grafana ────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: kissan-grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: kissanmithar123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3100
      GF_INSTALL_PLUGINS: >-
        grafana-clock-panel,
        grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards/json:/var/lib/grafana/dashboards:ro
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    networks:
      - monitoring-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── AlertManager ───────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: kissan-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Node Exporter (System Metrics) ─────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: kissan-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring-network

  # ─── cAdvisor (Container Metrics) ───────────────────────
  # NOTE: On macOS Docker Desktop, cgroup mounts are not available.
  # We mount only the Docker socket for container-level metrics.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: kissan-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring-network
      - kissan-network

  # ─── Redis Exporter ─────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: kissan-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kmc_redis_secret}
    env_file:
      - ../.env
    networks:
      - kissan-network
      - monitoring-network

  # ─── PostgreSQL Exporter ────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: kissan-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: ${SUPABASE_URL}
    env_file:
      - ../.env
    networks:
      - kissan-network
      - monitoring-network

  # ─── MongoDB Exporter ───────────────────────────────────
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: kissan-mongodb-exporter
    restart: unless-stopped
    ports:
      - "9216:9216"
    command:
      - '--no-mongodb.direct-connect'
    environment:
      MONGODB_URI: ${MONGODB_URI}
    env_file:
      - ../.env
    networks:
      - kissan-network
      - monitoring-network

  # ─── Pushgateway ────────────────────────────────────────
  pushgateway:
    image: prom/pushgateway:v1.6.2
    container_name: kissan-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - monitoring-network

  # ─── Nginx Prometheus Exporter ──────────────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:0.11.0
    container_name: kissan-nginx-exporter
    restart: unless-stopped
    ports:
      - "9113:9113"
    command:
      - '-nginx.scrape-uri=http://nginx:80/nginx_status'
    networks:
      - kissan-network
      - monitoring-network

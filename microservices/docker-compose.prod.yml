# ============================================================
# Kissan Mithar Consultancy — Production Docker Compose
# ============================================================
# Extends development with strict resource limits, no volume mounts, 
# and replication strategies for resilience.
# Usage: docker-compose -f docker-compose.prod.yml up -d
# ============================================================

version: '3.9'

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - kissan-network
  env_file:
    - .env
  environment:
    - NODE_ENV=production
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  # ─── Infrastructure ───────────────────
  nginx:
    image: nginx:alpine
    container_name: kissan-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - auth-service
    networks:
      - kissan-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: kissan-redis
    # Port not exposed externally in prod
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - kissan-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kissan-rabbitmq
    # Port not exposed externally in prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: kissan
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - kissan-network

  # ─── Microservices ────────────────────
  auth-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
      target: production
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/ai-service/Dockerfile
      target: production
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0' # Heavy CPU for AI processing
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  analytics-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/analytics-service/Dockerfile
      target: production
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 1G # Heavy Memory for Analytics aggregation

  # Add minimal config for remaining services (they inherit defaults)
  user-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
      target: production
  disease-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/disease-service/Dockerfile
      target: production
  soil-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/soil-service/Dockerfile
      target: production
  market-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/market-service/Dockerfile
      target: production
  ecommerce-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/ecommerce-service/Dockerfile
      target: production
  order-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
      target: production
  payment-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/payment-service/Dockerfile
      target: production
  notification-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
      target: production
  support-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/support-service/Dockerfile
      target: production
  expert-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/expert-service/Dockerfile
      target: production
  content-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/content-service/Dockerfile
      target: production
  field-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/field-service/Dockerfile
      target: production

  # ─── Frontend ─────────────────────────
  frontend:
    build:
      context: ./frontend/web
      target: production
    restart: unless-stopped
    networks:
      - kissan-network

  frontend-mobile:
    build:
      context: ./frontend/mobile
      target: production
    restart: unless-stopped
    networks:
      - kissan-network

volumes:
  redis_data:
  rabbitmq_data:

networks:
  kissan-network:
    driver: bridge

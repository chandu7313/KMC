user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ─── Logging Format ─────────────────
  log_format detailed
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct=$upstream_connect_time '
    'uht=$upstream_header_time urt=$upstream_response_time '
    'rid=$request_id';

  access_log /var/log/nginx/access.log detailed;

  # ─── Performance ────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  types_hash_max_size 2048;
  client_max_body_size 10M;
  server_tokens off;

  # ─── Buffer Sizes ───────────────────
  client_body_buffer_size 128k;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 16k;
  output_buffers 1 32k;
  postpone_output 1460;

  # ─── Timeouts ───────────────────────
  client_body_timeout 60s;
  client_header_timeout 60s;
  send_timeout 60s;

  # ─── Security Headers ───────────────
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Request-ID $request_id always;

  # ─── Gzip Compression ───────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # ─── Rate Limiting Zones ────────────
  # Global: 100 req/min per IP
  limit_req_zone $binary_remote_addr zone=global:20m rate=100r/m;

  # Auth: strict — 10 req/min per IP
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  # Upload: file uploads (disease scan, soil report)
  limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/m;

  # OTP: very strict — 3 req/min per IP
  limit_req_zone $binary_remote_addr zone=otp:10m rate=3r/m;

  # API: general endpoints — 60 req/min per IP
  limit_req_zone $binary_remote_addr zone=api:20m rate=60r/m;

  limit_req_status 429;
  limit_conn_status 429;

  # ─── Upstream Definitions ───────────
  # We are moving away from static upstream blocks to dynamic variables
  # inside kissan-mithar.conf to prevent Nginx from crashing on startup
  # if a container is down. Docker DNS (127.0.0.11) will handle round-robin LB.

  include /etc/nginx/conf.d/*.conf;
}

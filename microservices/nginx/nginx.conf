user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ─── Logging Format ─────────────────
  log_format main
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    '$request_time $upstream_response_time '
    '$request_id';

  access_log /var/log/nginx/access.log main;

  # ─── Performance ────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 10M;

  # ─── Security Headers ───────────────
  add_header X-Frame-Options "DENY";
  add_header X-Content-Type-Options "nosniff";
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy "strict-origin-when-cross-origin";
  add_header X-Request-ID $request_id;
  server_tokens off;

  # ─── Gzip Compression ───────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # ─── Rate Limiting Zones ────────────
  # Global: 100 req/min per IP
  limit_req_zone $binary_remote_addr zone=global:10m rate=100r/m;

  # Auth: strict — 10 req/min per IP
  # (OTP + login brute force protection)
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  # Upload: file uploads (disease scan, soil report)
  # Large files — 1r/m with burst=20
  limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/m;

  # OTP: very strict — 3 req/min per IP
  limit_req_zone $binary_remote_addr zone=otp:10m rate=3r/m;

  # API: general endpoints — 60 req/min per IP
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

  # ─── Upstream Definitions ───────────
  # Define backend services. Nginx resolves these via Docker DNS.
  upstream auth_service {
    least_conn;
    server auth-service:3001;
    keepalive 32;
  }
  upstream user_service {
    server user-service:3002;
    keepalive 32;
  }
  upstream ai_service {
    server ai-service:3003;
    keepalive 32;
  }
  upstream disease_service {
    server disease-service:3004;
    keepalive 32;
  }
  upstream soil_service {
    server soil-service:3005;
    keepalive 32;
  }
  upstream market_service {
    server market-service:3006;
    keepalive 32;
  }
  upstream ecommerce_service {
    server ecommerce-service:3007;
    keepalive 32;
  }
  upstream order_service {
    server order-service:3008;
    keepalive 32;
  }
  upstream payment_service {
    server payment-service:3009;
    keepalive 32;
  }
  upstream notification_service {
    server notification-service:3010;
    keepalive 32;
  }
  upstream support_service {
    server support-service:3011;
    keepalive 32;
  }
  upstream expert_service {
    server expert-service:3012;
    keepalive 32;
  }
  upstream content_service {
    server content-service:3013;
    keepalive 32;
  }
  upstream analytics_service {
    server analytics-service:3014;
    keepalive 32;
  }
  upstream field_service {
    server field-service:3015;
    keepalive 32;
  }
  upstream frontend {
    server frontend:3000;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}

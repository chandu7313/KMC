user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ─── Logging Format ─────────────────
  log_format detailed
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct=$upstream_connect_time '
    'uht=$upstream_header_time urt=$upstream_response_time '
    'rid=$request_id';

  access_log /var/log/nginx/access.log detailed;

  # ─── Performance ────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  types_hash_max_size 2048;
  client_max_body_size 10M;
  server_tokens off;

  # ─── Buffer Sizes ───────────────────
  client_body_buffer_size 128k;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 16k;
  output_buffers 1 32k;
  postpone_output 1460;

  # ─── Timeouts ───────────────────────
  client_body_timeout 60s;
  client_header_timeout 60s;
  send_timeout 60s;

  # ─── Security Headers ───────────────
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Request-ID $request_id always;

  # ─── Gzip Compression ───────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # ─── Rate Limiting Zones ────────────
  # Global: 100 req/min per IP
  limit_req_zone $binary_remote_addr zone=global:20m rate=100r/m;

  # Auth: strict — 10 req/min per IP
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  # Upload: file uploads (disease scan, soil report)
  limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/m;

  # OTP: very strict — 3 req/min per IP
  limit_req_zone $binary_remote_addr zone=otp:10m rate=3r/m;

  # API: general endpoints — 60 req/min per IP
  limit_req_zone $binary_remote_addr zone=api:20m rate=60r/m;

  limit_req_status 429;
  limit_conn_status 429;

  # ─── Upstream Definitions ───────────
  # CRITICAL: Use Docker service names (NOT container names)
  # Docker DNS resolves service names within kissan-network

  upstream auth_upstream {
    least_conn;
    server auth-service:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream user_upstream {
    server user-service:3002 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream ai_upstream {
    server ai-service:3003 max_fails=3 fail_timeout=30s;
    keepalive 16;
  }
  upstream disease_upstream {
    server disease-service:3004 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream soil_upstream {
    server soil-service:3005 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream market_upstream {
    server market-service:3006 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream ecommerce_upstream {
    server ecommerce-service:3007 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream order_upstream {
    server order-service:3008 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream payment_upstream {
    server payment-service:3009 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream notification_upstream {
    server notification-service:3010 max_fails=3 fail_timeout=30s;
    keepalive 16;
  }
  upstream support_upstream {
    server support-service:3011 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream expert_upstream {
    server expert-service:3012 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream content_upstream {
    server content-service:3013 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream analytics_upstream {
    server analytics-service:3014 max_fails=3 fail_timeout=30s;
    keepalive 16;
  }
  upstream field_upstream {
    server field-service:3015 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  upstream frontend_upstream {
    # CRITICAL: Must use Docker Compose SERVICE name, not container_name
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}

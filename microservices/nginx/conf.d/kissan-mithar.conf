server {
  listen 80;
  server_name localhost kissan-mithar.com www.kissan-mithar.com;

  # ─── CORS Headers ───────────────────
  add_header Access-Control-Allow-Origin $http_origin always;
  add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
  add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Request-ID' always;
  add_header Access-Control-Allow-Credentials 'true' always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  # ─── Gateway Health ─────────────────
  location = /health {
    access_log off;
    return 200 '{"status":"ok","service":"gateway"}';
    add_header Content-Type application/json;
  }

  # ─── Nginx Metrics (for Prometheus exporter) ──
  location = /nginx_status {
    stub_status on;
    access_log off;
    allow 172.25.0.0/16;    # Docker network
    allow 127.0.0.1;
    deny all;
  }

  # ─── Auth Service ───────────────────
  location /api/auth/farmer/send-otp {
    limit_req zone=otp burst=5 nodelay;
    proxy_pass http://auth_service/farmer/send-otp;
    include /etc/nginx/conf.d/proxy.conf;
  }

  location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://auth_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── User Service ───────────────────
  location /api/users/ {
    limit_req zone=global burst=20 nodelay;
    proxy_pass http://user_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # /api/survey/* → user-service
  location /api/survey/ {
    limit_req zone=global burst=10 nodelay;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://user_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── AI Service (internal only) ─────
  location /api/ai/ {
    # Block direct external access (allow internal docker bridge network)
    allow 172.25.0.0/16;
    deny all;
    proxy_pass http://ai_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── Disease Service ────────────────
  location /api/disease/ {
    limit_req zone=upload burst=20 nodelay;
    client_max_body_size 10M;
    proxy_pass http://disease_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── Soil Service ───────────────────
  location /api/soil/ {
    limit_req zone=upload burst=20 nodelay;
    client_max_body_size 10M;
    proxy_pass http://soil_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── Market Service ─────────────────
  location /api/market/ {
    limit_req zone=global burst=30 nodelay;
    proxy_pass http://market_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── E-Commerce Service ─────────────
  location /api/products/ {
    limit_req zone=global burst=30 nodelay;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://ecommerce_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  location /api/cart/ {
    limit_req zone=global burst=20 nodelay;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://ecommerce_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  location /api/vendors/ {
    limit_req zone=global burst=10 nodelay;
    proxy_pass http://ecommerce_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # /api/fertilizer/* → ecommerce-service
  location /api/fertilizer/ {
    limit_req zone=global burst=10 nodelay;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://ecommerce_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # /api/equipment/* → ecommerce-service
  location /api/equipment/ {
    limit_req zone=global burst=10 nodelay;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://ecommerce_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── Order Service ──────────────────
  location /api/orders/ {
    limit_req zone=global burst=20 nodelay;
    proxy_pass http://order_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── Payment Service ────────────────
  location /api/payments/ {
    limit_req zone=global burst=10 nodelay;
    proxy_pass http://payment_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # Razorpay webhook (no rate limit)
  location /api/payments/webhook {
    proxy_pass http://payment_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── Notification Service ───────────
  location /api/notify/ {
    limit_req zone=global burst=10 nodelay;
    proxy_pass http://notification_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── Support Service ────────────────
  location /api/support/ {
    limit_req zone=global burst=20 nodelay;
    proxy_pass http://support_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── Expert Service ─────────────────
  location /api/experts/ {
    limit_req zone=global burst=20 nodelay;
    proxy_pass http://expert_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # /api/booking/* → expert-service
  location /api/booking/ {
    limit_req zone=global burst=20 nodelay;
    rewrite ^/api/booking/(.*) /bookings/$1 break;
    proxy_pass http://expert_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── Content Service ────────────────
  # /api/content/* → content-service (generic)
  location /api/content/ {
    limit_req zone=global burst=20 nodelay;
    proxy_pass http://content_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # /api/blog/* → content-service
  location /api/blog/ {
    limit_req zone=global burst=20 nodelay;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://content_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # /api/success/* → content-service
  location /api/success/ {
    limit_req zone=global burst=20 nodelay;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://content_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # /api/success-story/* → content-service (alias)
  location /api/success-story/ {
    limit_req zone=global burst=20 nodelay;
    rewrite ^/api/success-story/(.*) /success/$1 break;
    proxy_pass http://content_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # /api/scheme/* → content-service
  location /api/scheme/ {
    limit_req zone=global burst=10 nodelay;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://content_service;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── Analytics Service ──────────────
  location /api/analytics/ {
    limit_req zone=global burst=10 nodelay;
    proxy_pass http://analytics_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── Field Service ──────────────────
  location /api/field/ {
    limit_req zone=global burst=10 nodelay;
    proxy_pass http://field_service/;
    include /etc/nginx/conf.d/proxy.conf;
  }

  # ─── Frontend (React App) ───────────
  location / {
    limit_req zone=global burst=50 nodelay;
    proxy_pass http://frontend;
    include /etc/nginx/conf.d/proxy.conf;

    # SPA routing support
    proxy_intercept_errors on;
    error_page 404 = @frontend_fallback;
  }

  location @frontend_fallback {
    proxy_pass http://frontend;
  }

  # ─── Error Pages ────────────────────
  error_page 429 /429.json;
  location = /429.json {
    return 429 '{"success":false,"error":{"message":"Too many requests. Please slow down.","code":"RATE_LIMIT_EXCEEDED"}}';
    add_header Content-Type application/json;
  }

  error_page 502 503 504 /50x.json;
  location = /50x.json {
    return 503 '{"success":false,"error":{"message":"Service temporarily unavailable.","code":"SERVICE_UNAVAILABLE"}}';
    add_header Content-Type application/json;
  }
}

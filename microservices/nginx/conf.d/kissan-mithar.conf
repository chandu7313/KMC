# ─── Map for CORS origins ──────────────
map $http_origin $cors_origin {
  default "";
  "http://localhost:3000"         $http_origin;
  "http://localhost:5173"         $http_origin;
  "http://localhost"              $http_origin;
  "http://127.0.0.1:3000"        $http_origin;
  "https://kissanmithar.com"     $http_origin;
  "https://www.kissanmithar.com" $http_origin;
  "http://65.0.255.176" $http_origin;
  "http://[IP_ADDRESS]" $http_origin;
}

server {
  listen 80;
  server_name kissanmithar.com www.kissanmithar.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name kissanmithar.com www.kissanmithar.com;

  resolver 127.0.0.11 valid=10s ipv6=off;

  ssl_certificate /etc/letsencrypt/live/kissanmithar.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kissanmithar.com/privkey.pem;

  # TLS Config
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  
  ssl_stapling on;
  ssl_stapling_verify on;

  # ─── Generate Request ID ──────────────
  add_header X-Request-ID $request_id always;

  # ─── Security Headers ─────────────────
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; connect-src 'self' https://api.razorpay.com;" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ─── Gateway Health Check ─────────────
  location = /health {
    access_log off;
    add_header Content-Type application/json always;
    return 200 '{"status":"ok","service":"kissan-gateway","timestamp":"$time_iso8601"}';
  }

  # ─── Nginx Status (for Prometheus exporter) ──
  location = /nginx_status {
    stub_status on;
    access_log off;
    allow 172.25.0.0/16;
    allow 127.0.0.1;
    deny all;
  }

  # ═══════════════════════════════════════
  # API ROUTES — with CORS + Rate Limiting
  # ═══════════════════════════════════════

  # ─── Auth Service ─────────────────────

  # OTP endpoint — strictest rate limit
  location = /api/auth/farmer/send-otp {
    limit_req zone=otp burst=5 nodelay;

    # CORS headers
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Expose-Headers "X-Request-ID" always;

    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, X-Language, Accept, Origin" always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Max-Age "86400" always;
      add_header Content-Length "0";
      add_header Content-Type "text/plain";
      return 204;
    }

    set $backend http://auth-service:3001;
    rewrite ^/api/auth/(.*) /$1 break;
    proxy_pass $backend;
    include /etc/nginx/conf.d/proxy_params.conf;
  }

  # Dev login — no rate limit
  location = /api/auth/dev-login {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;

    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, X-Language, Accept, Origin" always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Max-Age "86400" always;

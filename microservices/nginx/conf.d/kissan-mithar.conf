    proxy_pass $backend;
    include /etc/nginx/conf.d/proxy_params.conf;
  }

  # ─── Field Service ────────────────────
  location /api/field/ {
    limit_req zone=global burst=10 nodelay;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Expose-Headers "X-Request-ID" always;

    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, X-Language, Accept, Origin" always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Max-Age "86400" always;
      add_header Content-Length "0";
      add_header Content-Type "text/plain";
      return 204;
    }

    set $backend http://field-service:3015;
    rewrite ^/api/field/(.*) /$1 break;
    proxy_pass $backend;
    include /etc/nginx/conf.d/proxy_params.conf;
  }

  # ═══════════════════════════════════════
  # FRONTEND (React App via Vite dev server)
  # ═══════════════════════════════════════
  location / {
    set $backend http://frontend:80;
    proxy_pass $backend;
    include /etc/nginx/conf.d/proxy_params.conf;

    # WebSocket support for Vite HMR
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # SPA routing support
    proxy_intercept_errors on;
    error_page 404 = @spa_fallback;
  }

  location @spa_fallback {
    set $backend http://frontend:80;
    proxy_pass $backend;
    include /etc/nginx/conf.d/proxy_params.conf;
  }

  # ═══════════════════════════════════════
  # ERROR RESPONSES (JSON)
  # ═══════════════════════════════════════
  error_page 429 /429.json;
  location = /429.json {
    internal;
    add_header Content-Type application/json always;
    return 429 '{"success":false,"error":{"message":"Too many requests. Please slow down.","code":"RATE_LIMIT_EXCEEDED"}}';
  }

  error_page 500 502 503 504 /50x.json;
  location = /50x.json {
    internal;
    add_header Content-Type application/json always;
    return 503 '{"success":false,"error":{"message":"Service temporarily unavailable. Please try again.","code":"SERVICE_UNAVAILABLE"}}';
  }
}

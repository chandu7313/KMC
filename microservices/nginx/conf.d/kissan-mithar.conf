# ============================================================
# Kissan Mithar — Reverse Proxy Routing
# ============================================================
# Maps /api/{service}/* → {service}:{port}
# ============================================================

# ── Upstream Definitions ──
upstream auth_service       { server auth-service:3001; }
upstream user_service       { server user-service:3002; }
upstream ai_service         { server ai-service:3003; }
upstream disease_service    { server disease-service:3004; }
upstream soil_service       { server soil-service:3005; }
upstream market_service     { server market-service:3006; }
upstream ecommerce_service  { server ecommerce-service:3007; }
upstream order_service      { server order-service:3008; }
upstream payment_service    { server payment-service:3009; }
upstream notification_service { server notification-service:3010; }
upstream support_service    { server support-service:3011; }
upstream expert_service     { server expert-service:3012; }
upstream content_service    { server content-service:3013; }
upstream analytics_service  { server analytics-service:3014; }
upstream field_service      { server field-service:3015; }

server {
    listen 80;
    server_name localhost kissanmithar.com *.kissanmithar.com;

    # ── Gateway Health Check ──
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"api-gateway","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # ── Common Proxy Settings ──
    # Injected via proxy_pass blocks below
    # Sets X-Request-ID for distributed tracing

    # ── Auth Service ──
    location /api/auth/ {
        limit_req zone=ip_limit burst=20 nodelay;
        proxy_pass http://auth_service/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── User Service ──
    location /api/users/ {
        limit_req zone=ip_limit burst=30 nodelay;
        proxy_pass http://user_service/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── AI Service ──
    location /api/ai/ {
        limit_req zone=ip_limit burst=10 nodelay;
        proxy_pass http://ai_service/;
        proxy_read_timeout 120s;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Disease Service ──
    location /api/disease/ {
        limit_req zone=ip_limit burst=15 nodelay;
        proxy_pass http://disease_service/;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Soil Service ──
    location /api/soil/ {
        limit_req zone=ip_limit burst=15 nodelay;
        proxy_pass http://soil_service/;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Market Service ──
    location /api/market/ {
        limit_req zone=ip_limit burst=30 nodelay;
        proxy_pass http://market_service/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── E-Commerce Service ──
    location /api/products/ {
        limit_req zone=ip_limit burst=50 nodelay;
        proxy_pass http://ecommerce_service/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Order Service ──
    location /api/orders/ {
        limit_req zone=ip_limit burst=30 nodelay;
        proxy_pass http://order_service/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Fertilizer Catalog → ecommerce-service ──
    location /api/fertilizer/ {
        limit_req zone=ip_limit burst=30 nodelay;
        proxy_pass http://ecommerce_service/fertilizers/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Fertilizer Orders → order-service ──
    location /api/fertilizer-orders/ {
        limit_req zone=ip_limit burst=30 nodelay;
        proxy_pass http://order_service/fertilizer/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Equipment Catalog → ecommerce-service ──
    location /api/equipment/ {
        limit_req zone=ip_limit burst=30 nodelay;
        proxy_pass http://ecommerce_service/equipments/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Equipment Orders → order-service ──
    location /api/equipment-orders/ {
        limit_req zone=ip_limit burst=30 nodelay;
        proxy_pass http://order_service/equipment/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Payment Service ──
    location /api/payments/ {
        limit_req zone=ip_limit burst=10 nodelay;
        proxy_pass http://payment_service/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Notification Service ──
    location /api/notify/ {
        limit_req zone=ip_limit burst=20 nodelay;
        proxy_pass http://notification_service/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Support Service ──
    location /api/support/ {
        limit_req zone=ip_limit burst=20 nodelay;
        proxy_pass http://support_service/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Expert Service ──
    location /api/experts/ {
        limit_req zone=ip_limit burst=20 nodelay;
        proxy_pass http://expert_service/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Content Service ──
    location /api/content/ {
        limit_req zone=ip_limit burst=30 nodelay;
        proxy_pass http://content_service/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Analytics Service ──
    location /api/analytics/ {
        limit_req zone=ip_limit burst=20 nodelay;
        proxy_pass http://analytics_service/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Field Service ──
    location /api/field/ {
        limit_req zone=ip_limit burst=20 nodelay;
        proxy_pass http://field_service/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Default: 404 for unknown API routes ──
    location /api/ {
        return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"API endpoint not found"}}';
        add_header Content-Type application/json;
    }
}

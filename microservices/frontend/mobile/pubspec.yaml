name: kmc_mobile
description: "Kissan Mithar Consultancy — Agriculture Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # --- UI Essentials ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fluttertoast: ^8.2.10
  pinput: ^5.0.1
  flutter_svg: ^2.0.17

  # --- State Management ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Networking ---
  dio: ^5.7.0
  connectivity_plus: ^6.1.4

  # --- Navigation ---
  go_router: ^14.8.1

  # --- Local Storage & Security ---
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # --- Environment ---
  flutter_dotenv: ^5.2.1

  # --- Media ---
  image_picker: ^1.1.2

  # --- Payments (mobile only — conditionally imported) ---
  # razorpay_flutter: ^1.3.7  # Disabled: no web support

  # --- Utilities ---
  intl: ^0.20.2
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - .env

# ============================================================
# Kissan Mithar Consultancy — Testing Docker Compose
# ============================================================
# Usage: docker-compose -f docker-compose.test.yml up --abort-on-container-exit
# Runs the full test suite in an isolated environment.
# ============================================================

version: '3.9'

x-service-defaults: &service-defaults
  networks:
    - kissan-test-network
  environment:
    - NODE_ENV=test
    - SUPABASE_URL=${TEST_SUPABASE_URL}
    - MONGODB_URI=${TEST_MONGODB_URI}
    - REDIS_URL=redis://test-redis:6379
    - RABBITMQ_URL=amqp://admin:password@test-rabbitmq:5672/kissan
    - JWT_SECRET=test_secret_do_not_use
    - JWT_REFRESH_SECRET=test_refresh_secret

services:
  # ─── Isolated Infrastructure ──────────
  test-redis:
    image: redis:7-alpine
    networks:
      - kissan-test-network
    
  test-rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_DEFAULT_VHOST: kissan
    networks:
      - kissan-test-network

  # ─── Global Test Runner ───────────────
  test-runner:
    build:
      context: .
      dockerfile: ./Dockerfile.template
      target: dependencies
    command: npm test --workspaces
    volumes:
      - ./:/app
    depends_on:
      - test-redis
      - test-rabbitmq
    environment:
      - NODE_ENV=test
      - REDIS_URL=redis://test-redis:6379
      - RABBITMQ_URL=amqp://admin:password@test-rabbitmq:5672/kissan
    networks:
      - kissan-test-network

networks:
  kissan-test-network:
    driver: bridge

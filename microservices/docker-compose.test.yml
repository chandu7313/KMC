# ============================================================
# Kissan Mithar — Test Docker Compose
# ============================================================
# Usage: docker-compose -f docker-compose.test.yml up --abort-on-container-exit
# Spins up infrastructure + runs tests against services.
# ============================================================

version: '3.9'

services:
  redis-test:
    image: redis:7-alpine
    container_name: kissan-redis-test
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - kissan-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq-test:
    image: rabbitmq:3.13-alpine
    container_name: kissan-rabbitmq-test
    ports:
      - "5673:5672"
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    networks:
      - kissan-test-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: kissan-test-runner
    environment:
      NODE_ENV: test
      REDIS_URL: redis://redis-test:6379
      RABBITMQ_URL: amqp://test:test@rabbitmq-test:5672
      JWT_SECRET: test_secret_key_for_testing
    depends_on:
      redis-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy
    networks:
      - kissan-test-network
    command: npm test

networks:
  kissan-test-network:
    driver: bridge

# ============================================================
# Kissan Mithar Consultancy — Development Docker Compose
# ============================================================
# Usage: docker-compose up -d
# All 15 microservices + Nginx + Redis + RabbitMQ
# ============================================================

version: '3.9'

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - kissan-network
  env_file:
    - .env
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ──────────────────────────────────────
  # INFRASTRUCTURE
  # ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: kissan-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - auth-service
      - user-service
      - ai-service
      - disease-service
      - soil-service
      - market-service
      - ecommerce-service
      - order-service
      - payment-service
      - notification-service
      - support-service
      - expert-service
      - content-service
      - analytics-service
      - field-service
      - frontend
    restart: unless-stopped
    networks:
      - kissan-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: kissan-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - kissan-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kissan-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: kissan
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    restart: unless-stopped
    networks:
      - kissan-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ──────────────────────────────────────
  # ALL 15 MICROSERVICES
  # ──────────────────────────────────────

  auth-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
      target: development
    container_name: kissan-auth
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - SERVICE_NAME=auth-service
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - RABBITMQ_URL=${RABBITMQ_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FAST2SMS_API_KEY=${FAST2SMS_API_KEY}
      - ENABLE_SMS=${ENABLE_SMS}
      - BCRYPT_ROUNDS=12
    volumes:
      - ./services/auth-service/src:/app/services/auth-service/src
      - /app/node_modules
      - ./packages:/app/packages
      - ./logs/auth-service:/app/logs
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


    driver: bridge
    name: kissan-network

# ──────────────────────────────────────
# VOLUMES
# ──────────────────────────────────────
volumes:
  redis-data:
    name: kissan-redis-data
  rabbitmq-data:
    name: kissan-rabbitmq-data

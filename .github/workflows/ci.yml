# ============================================================
# Kissan Mithar Consultancy — Continuous Integration Pipeline
# ============================================================
# Runs on every push to main and on pull requests targeting main.
# Three parallel jobs:
#   1. frontend-ci  → Lint & build the React/Vite frontend
#   2. backend-ci   → Install workspaces & run unit tests
#   3. docker-check → Smoke-build key Docker images
# ============================================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Frontend — Lint & Build
  # ──────────────────────────────────────────────
  frontend-ci:
    name: 🎨 Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/frontend/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: microservices/frontend/web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          VITE_BACKEND_URL: https://kissanmithar.com
          VITE_APP_ENV: production

  # ──────────────────────────────────────────────
  # Job 2: Backend — Install & Test Workspaces
  # ──────────────────────────────────────────────
  backend-ci:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: microservices/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run unit tests across workspaces
        run: npm test --workspaces --if-present

  # ──────────────────────────────────────────────
  # Job 3: Docker — Smoke Build Check
  # ──────────────────────────────────────────────
  docker-build-check:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify docker-compose config
        working-directory: microservices
        run: |
          touch .env
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Smoke build — auth-service (production target)
        working-directory: microservices
        run: |
          docker build \
            --file ./services/auth-service/Dockerfile \
            --target production \
            --tag kmc/auth-service:ci-check \
            .

      - name: Smoke build — frontend (production target)
        working-directory: microservices/frontend/web
        run: |
          docker build \
            --target production \
            --tag kmc/frontend:ci-check \
            .

      - name: Cleanup CI images
        if: always()
        run: |
          docker rmi kmc/auth-service:ci-check kmc/frontend:ci-check 2>/dev/null || true
